<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMA Bridge — Offer Activation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #00e5a0;
    --accent2:  #0096ff;
    --danger:   #ff4466;
    --warn:     #ffaa00;
    --text:     #e8e8f0;
    --muted:    #555570;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }

  /* background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .logo span { color: var(--accent2); }
  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card-title {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* ── INPUTS ── */
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  input[type=text], input[type=number] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  /* ── QUANTITY ROW ── */
  .qty-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .qty-btn {
    width: 36px; height: 36px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.15s;
    flex-shrink: 0;
  }
  .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
  #qty-display {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    min-width: 32px;
    text-align: center;
  }
  .qty-label { font-size: 11px; color: var(--muted); margin-left: 4px; }

  /* ── BUTTON ── */
  .btn-activate {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #000;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: opacity 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }
  .btn-activate:active { transform: scale(0.98); }
  .btn-activate:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  .btn-activate.running { background: var(--warn); color: #000; }

  /* ── BRIDGE STATUS ── */
  .bridge-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.ok   { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .dot.fail { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
  .dot.pulse {
    background: var(--warn);
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse { to { opacity: 0.3; } }

  /* ── LOG ── */
  .log-wrap {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .log-clear {
    background: none; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 11px; cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .log-clear:hover { color: var(--danger); }
  #log-body {
    height: 220px;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #log-body::-webkit-scrollbar { width: 4px; }
  #log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .log-line {
    font-size: 12px;
    line-height: 1.5;
    display: flex;
    gap: 10px;
  }
  .log-time { color: var(--muted); flex-shrink: 0; }
  .log-line.success .log-msg { color: var(--accent); }
  .log-line.error   .log-msg { color: var(--danger); }
  .log-line.warn    .log-msg { color: var(--warn); }
  .log-line.info    .log-msg { color: var(--accent2); }
  .log-line.default .log-msg { color: var(--text); }

  /* ── PROGRESS ── */
  .progress-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; color: var(--muted);
  }
  .progress-bar-wrap {
    flex: 1; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; background: var(--accent); width: 0%;
    transition: width 0.3s; border-radius: 4px;
  }
  #progress-label { flex-shrink: 0; min-width: 60px; text-align: right; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">GMA<span>Bridge</span></div>
    <div class="tagline">offerActivation — direct bridge tool</div>
  </header>

  <!-- INPUT CARD -->
  <div class="card">
    <div class="card-title">Payload</div>

    <div class="field">
      <label for="inp-loyalty">Loyalty ID</label>
      <input id="inp-loyalty" type="text" placeholder="Contoh: 5570" inputmode="numeric" autocomplete="off">
    </div>

    <div class="field">
      <label for="inp-reward">Reward / Offer ID</label>
      <input id="inp-reward" type="text" placeholder="Contoh: 288663" inputmode="numeric" autocomplete="off">
    </div>

    <div class="field">
      <label>Jumlah klaim</label>
      <div class="qty-row">
        <button class="qty-btn" id="qty-minus">−</button>
        <div id="qty-display">1</div>
        <button class="qty-btn" id="qty-plus">+</button>
        <span class="qty-label">iterasi</span>
      </div>
    </div>

    <!-- Bridge status -->
    <div class="bridge-status">
      <div class="dot" id="bridge-dot"></div>
      <span id="bridge-label">Mendeteksi bridge…</span>
    </div>
  </div>

  <!-- ACTION -->
  <button class="btn-activate" id="btn-activate" disabled>
    Aktivasi via Bridge
  </button>

  <!-- PROGRESS -->
  <div class="progress-row" id="progress-row" style="display:none">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <span id="progress-label">0 / 0</span>
  </div>

  <!-- LOG -->
  <div class="log-wrap">
    <div class="log-header">
      <span>Monitor</span>
      <button class="log-clear" id="btn-clear">Bersihkan</button>
    </div>
    <div id="log-body">
      <div class="log-line default"><span class="log-time">--:--:--</span><span class="log-msg">Menunggu input…</span></div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ── STATE ──────────────────────────────────────────────────────────────────
  var quantity    = 1;
  var running     = false;
  var bridgeReady = false;
  var BRIDGE_TIMEOUT_MS = 15000;
  var BRIDGE_RETRY_INTERVAL = 300;
  var BRIDGE_MAX_ATTEMPTS   = 10;

  // ── DOM ────────────────────────────────────────────────────────────────────
  var inpLoyalty   = document.getElementById('inp-loyalty');
  var inpReward    = document.getElementById('inp-reward');
  var qtyDisplay   = document.getElementById('qty-display');
  var qtyMinus     = document.getElementById('qty-minus');
  var qtyPlus      = document.getElementById('qty-plus');
  var btnActivate  = document.getElementById('btn-activate');
  var bridgeDot    = document.getElementById('bridge-dot');
  var bridgeLabel  = document.getElementById('bridge-label');
  var logBody      = document.getElementById('log-body');
  var btnClear     = document.getElementById('btn-clear');
  var progressRow  = document.getElementById('progress-row');
  var progressBar  = document.getElementById('progress-bar');
  var progressLbl  = document.getElementById('progress-label');

  // ── LOGGING ────────────────────────────────────────────────────────────────
  function log(msg, type) {
    // type: 'success' | 'error' | 'warn' | 'info' | 'default'
    type = type || 'default';
    var now  = new Date().toLocaleTimeString('id-ID');
    var line = document.createElement('div');
    line.className = 'log-line ' + type;
    line.innerHTML = '<span class="log-time">' + now + '</span>'
                   + '<span class="log-msg">' + escHtml(msg) + '</span>';
    logBody.appendChild(line);
    logBody.scrollTop = logBody.scrollHeight;
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  btnClear.addEventListener('click', function () {
    logBody.innerHTML = '';
    log('Log dibersihkan.', 'default');
  });

  // ── BRIDGE DETECTION ───────────────────────────────────────────────────────
  function updateBridgeUI(state) {
    // state: 'checking' | 'ok' | 'fail'
    bridgeDot.className = 'dot ' + (state === 'ok' ? 'ok' : state === 'fail' ? 'fail' : 'pulse');
    bridgeLabel.textContent =
        state === 'ok'   ? 'GMA_Lite.bridge terdeteksi — siap'
      : state === 'fail' ? 'Bridge tidak ditemukan — buka via GMA App'
      : 'Mendeteksi bridge…';
  }

  function checkBridge() {
    var w = window;
    if (w.GMA_Lite && w.GMA_Lite.bridge) {
      bridgeReady = true;
      updateBridgeUI('ok');
      log('Bridge terdeteksi: GMA_Lite.bridge ready.', 'success');
      btnActivate.disabled = false;
    } else if (w.__GMALITE_BRIDGE__) {
      bridgeReady = true;
      updateBridgeUI('ok');
      log('Bridge terdeteksi: __GMALITE_BRIDGE__ ready.', 'success');
      btnActivate.disabled = false;
    } else {
      bridgeReady = false;
      updateBridgeUI('fail');
      log('GMA_Lite.bridge tidak ditemukan. Harus dibuka dari dalam GMA/GoTo App.', 'warn');
      btnActivate.disabled = false; // allow manual attempt anyway
    }
  }

  // ── CORE BRIDGE CALL ───────────────────────────────────────────────────────
  /**
   * Calls GMA_Lite.bridge.send('offerActivation') with loyaltyId + rewardId.
   * Returns a Promise<{ success: boolean, error?: string }>
   */
  function activateViaAppBridge(payload) {
    return new Promise(function (resolve) {
      var attempts = 0;

      function tryBridge() {
        attempts++;
        var w = window;

        // Check bridge presence
        if (!w.GMA_Lite || !w.GMA_Lite.bridge) {
          if (attempts < BRIDGE_MAX_ATTEMPTS) {
            setTimeout(tryBridge, BRIDGE_RETRY_INTERVAL);
            return;
          }
          resolve({ success: false, error: 'Bridge not detected after ' + BRIDGE_MAX_ATTEMPTS + ' attempts. Open in GMA App.' });
          return;
        }

        try {
          var call    = w.GMA_Lite.bridge.send('offerActivation');
          var settled = false;

          var timer = setTimeout(function () {
            if (!settled) {
              settled = true;
              resolve({ success: false, error: 'Bridge timeout (' + (BRIDGE_TIMEOUT_MS / 1000) + 's)' });
            }
          }, BRIDGE_TIMEOUT_MS);

          call.on('data', function () {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              resolve({ success: true });
            }
          });

          call.on('error', function (err) {
            if (!settled) {
              settled = true;
              clearTimeout(timer);
              var msg = typeof err === 'string' ? err : JSON.stringify(err);
              resolve({ success: false, error: 'Bridge error: ' + msg });
            }
          });

          // Fire the actual bridge call
          call.send({
            loyaltyId:    String(payload.loyaltyId),
            rewardId:     String(payload.rewardId),
            autoActivate: false,
          });

        } catch (e) {
          resolve({ success: false, error: 'Bridge exception: ' + e.message });
        }
      }

      tryBridge();
    });
  }

  // ── QUANTITY ───────────────────────────────────────────────────────────────
  function setQty(n) {
    quantity = Math.max(1, Math.min(50, n));
    qtyDisplay.textContent = quantity;
  }
  qtyMinus.addEventListener('click', function () { setQty(quantity - 1); });
  qtyPlus.addEventListener('click',  function () { setQty(quantity + 1); });

  // ── PROGRESS ───────────────────────────────────────────────────────────────
  function setProgress(done, total) {
    progressRow.style.display = 'flex';
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;
    progressBar.style.width   = pct + '%';
    progressLbl.textContent   = done + ' / ' + total;
  }

  function hideProgress() { progressRow.style.display = 'none'; }

  // ── MAIN ACTIVATION LOOP ───────────────────────────────────────────────────
  btnActivate.addEventListener('click', function () {
    if (running) return;

    var loyaltyId = inpLoyalty.value.trim();
    var rewardId  = inpReward.value.trim();

    if (!loyaltyId || !rewardId) {
      log('Loyalty ID dan Reward ID wajib diisi!', 'error');
      return;
    }

    running = true;
    btnActivate.disabled    = true;
    btnActivate.classList.add('running');
    btnActivate.textContent = 'Memproses…';

    var successCount = 0;
    var failCount    = 0;
    var total        = quantity;
    var index        = 0;

    log('Mulai ' + total + ' klaim — loyaltyId: ' + loyaltyId + ', rewardId: ' + rewardId, 'info');

    function done() {
      running = false;
      btnActivate.disabled    = false;
      btnActivate.classList.remove('running');
      btnActivate.textContent = 'Aktivasi via Bridge';
      setProgress(total, total);
      log('Selesai. ✓ Berhasil: ' + successCount + '  ✗ Gagal: ' + failCount,
          failCount === 0 ? 'success' : successCount === 0 ? 'error' : 'warn');
    }

    function next() {
      if (index >= total) {
        done();
        return;
      }

      setProgress(index, total);
      log('Klaim #' + (index + 1) + ' — mengirim ke bridge…', 'default');

      activateViaAppBridge({ loyaltyId: loyaltyId, rewardId: rewardId })
        .then(function (result) {
          if (result.success) {
            successCount++;
            log('Klaim #' + (index + 1) + ' ✓ BERHASIL', 'success');
          } else {
            failCount++;
            log('Klaim #' + (index + 1) + ' ✗ GAGAL — ' + result.error, 'error');
          }
          index++;
          // small delay between iterations to avoid bridge spam
          setTimeout(next, 300);
        });
    }

    next();
  });

  // ── INIT ───────────────────────────────────────────────────────────────────
  updateBridgeUI('checking');
  setTimeout(checkBridge, 400);

})();
</script>
</body>
</html>
