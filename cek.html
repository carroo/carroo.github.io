<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Makan Enak by Carroo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #f4f4f2;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 32px 16px 40px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 28px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid #e8e8e6;
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    border-radius: 10px;
    border: 1.5px solid #e0e0dc;
    background: #fafafa;
    color: #1a1a1a;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  input[type="text"]:focus {
    border-color: #DA291C;
    background: #fff;
  }

  input[type="text"]::placeholder { color: #bbb; }

  .btn {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    background: #DA291C;
    color: #fff;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .log-box {
    background: #1a1a1a;
    border-radius: 10px;
    padding: 12px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    min-height: 120px;
    max-height: 220px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .log-line { margin: 2px 0; line-height: 1.5; }
  .log-info { color: #7ec8e3; }
  .log-ok { color: #5DCAA5; }
  .log-err { color: #f0997b; }
  .log-default { color: #ddd; }

  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .log-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #999;
  }

  .btn-clear {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    color: #777;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<h1>Makan enak by carroo</h1>

<div class="card">
  <div class="field">
    <label for="inp-loyalty">Loyalty ID</label>
    <input type="text" id="inp-loyalty" placeholder="contoh: 9912345">
  </div>
  <div class="field" style="margin-bottom:18px;">
    <label for="inp-reward">Reward ID</label>
    <input type="text" id="inp-reward" placeholder="contoh: RWD-001">
  </div>
  <button class="btn" id="btn-inject" onclick="doInject()">Inject</button>
</div>

<div class="card">
  <div class="log-header">
    <span class="log-title">Log</span>
    <button class="btn-clear" onclick="clearLog()">clear</button>
  </div>
  <div class="log-box" id="log-box">
    <div class="log-line log-info">» ready.</div>
  </div>
</div>

<script>
  function log(msg, type) {
    var box = document.getElementById('log-box');
    var line = document.createElement('div');
    var ts = new Date().toLocaleTimeString('id-ID');
    line.className = 'log-line log-' + (type || 'default');
    line.textContent = '[' + ts + '] ' + msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function clearLog() {
    document.getElementById('log-box').innerHTML = '';
  }

  function doInject() {
    var loyaltyId = document.getElementById('inp-loyalty').value.trim();
    var rewardId  = document.getElementById('inp-reward').value.trim();

    if (!loyaltyId || !rewardId) {
      log('loyaltyId dan rewardId wajib diisi.', 'err');
      return;
    }

    if (typeof mcd === 'undefined' || !mcd.bridge) {
      log('mcd.bridge tidak ditemukan.', 'err');
      return;
    }

    log('sending → loyaltyId: ' + loyaltyId + ' rewardId: ' + rewardId, 'info');

    var btn = document.getElementById('btn-inject');
    btn.disabled = true;
    btn.textContent = 'Loading...';

    var offerActivation = mcd.bridge.message('offers');
    offerActivation.send({
      offerActivate: {
        loyaltyId: loyaltyId,
        autoActivate: true,
        rewardId: rewardId
      }
    });

    offerActivation.on('data', function(data) {
      log('data: ' + JSON.stringify(data), 'ok');
    });

    offerActivation.on('error', function(err) {
      log('error: ' + JSON.stringify(err), 'err');
      btn.disabled = false;
      btn.textContent = 'Inject';
    });

    offerActivation.on('done', function() {
      log('done.', 'ok');
      btn.disabled = false;
      btn.textContent = 'Inject';
    });
  }

  document.addEventListener('mcdBridgeReady', function() {
    log('mcdBridgeReady ✓', 'ok');
    var system = mcd.bridge.message('system');
    system.send({ hideNavigationbar: false, hideCloseButton: false });
  });
</script>
</body>
</html>
