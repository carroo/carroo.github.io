<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Claim - Simple</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input, button { padding: 10px; margin: 8px 0; width: 100%; font-size: 16px; }
    button { background: #e60012; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:disabled { background: #ccc; }
    #log { height: 400px; overflow-y: auto; background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 14px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>McD Bridge Claim</h2>
    
    <label>Loyalty ID</label>
    <input type="text" id="loyaltyId" placeholder="Masukkan Loyalty ID" value="">

    <label>Reward ID</label>
    <input type="text" id="rewardId" placeholder="Masukkan Reward ID" value="">

    <label>Jumlah Claim (Quantity)</label>
    <input type="number" id="quantity" value="1" min="1">

    <button id="startBtn">🚀 Mulai Claim</button>

    <div id="log"></div>
  </div>

  <script>
    const logDiv = document.getElementById('log');
    const startBtn = document.getElementById('startBtn');

    function addLog(message, type = 'info') {
      const time = new Date().toLocaleTimeString('id-ID');
      let color = '#0f0';
      
      if (type === 'error') color = '#f66';
      if (type === 'success') color = '#6f6';
      if (type === 'warn') color = '#ff0';

      logDiv.innerHTML += `<span style="color:${color}">[${time}] ${message}</span><br>`;
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function claimWithBridge(loyaltyId, rewardId) {
      return new Promise((resolve) => {
        if (!window.mcd || !window.mcd.bridge) {
          addLog("❌ Bridge tidak terdeteksi! Buka di aplikasi McD.", "error");
          resolve({ success: false, error: "Bridge not found" });
          return;
        }

        try {
          addLog(`Mengirim claim → Loyalty: ${loyaltyId} | Reward: ${rewardId}`);

          const message = window.mcd.bridge.message("offerActivation");
          let finished = false;
          const timeout = setTimeout(() => {
            if (!finished) {
              finished = true;
              addLog("⏰ Bridge Timeout", "error");
              resolve({ success: false, error: "Bridge timeout" });
            }
          }, 15000); // 15 detik timeout

          message.on("data", () => {
            if (!finished) {
              finished = true;
              clearTimeout(timeout);
              addLog("✅ Claim berhasil dikirim ke bridge", "success");
              resolve({ success: true });
            }
          });

          message.on("error", (err) => {
            if (!finished) {
              finished = true;
              clearTimeout(timeout);
              const errorMsg = typeof err === "string" ? err : JSON.stringify(err);
              addLog(`❌ Bridge Error: ${errorMsg}`, "error");
              resolve({ success: false, error: errorMsg });
            }
          });

          message.send({
            loyaltyId: loyaltyId,
            rewardId: rewardId,
            autoActivate: false
          });

        } catch (e) {
          addLog(`❌ Error: ${e.message}`, "error");
          resolve({ success: false, error: e.message });
        }
      });
    }

    async function startClaiming() {
      const loyaltyId = document.getElementById('loyaltyId').value.trim();
      const rewardId = document.getElementById('rewardId').value.trim();
      const quantity = parseInt(document.getElementById('quantity').value) || 1;

      if (!loyaltyId || !rewardId) {
        addLog("⚠️ Loyalty ID dan Reward ID harus diisi!", "error");
        return;
      }

      startBtn.disabled = true;
      addLog(`🔄 Memulai ${quantity} kali claim...`, "warn");

      for (let i = 1; i <= quantity; i++) {
        addLog(`<b>Claim ke-${i} dari ${quantity}</b>`);
        
        const result = await claimWithBridge(loyaltyId, rewardId);
        
        if (!result.success) {
          addLog(`Claim ke-${i} gagal.`, "error");
        }

        // Delay antar claim (opsional, bisa diubah)
        if (i < quantity) {
          await new Promise(r => setTimeout(r, 800)); // 800ms delay
        }
      }

      addLog("✅ Semua claim selesai diproses.", "success");
      startBtn.disabled = false;
    }

    // Event Listener
    startBtn.addEventListener('click', startClaiming);

    // Info saat halaman dibuka
    window.onload = () => {
      if (window.mcd && window.mcd.bridge) {
        addLog("✅ Bridge terdeteksi. Siap claim.", "success");
      } else {
        addLog("⚠️ Bridge belum terdeteksi. Pastikan dibuka di aplikasi McD.", "warn");
      }
    };
  </script>
</body>
</html>
