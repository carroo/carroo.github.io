<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Meta penting dari asli -->
  <meta name="app-base" content="https://domain-asli-kamu.com">
  
  <title>McD Claim</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f8f8f8; }
    .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 14px; margin: 10px 0; font-size: 16px; border-radius: 6px; }
    button { background: #e60012; color: white; border: none; font-weight: bold; }
    #log { height: 450px; overflow-y: auto; background: #1e1e1e; color: #00ff00; padding: 15px; margin-top: 15px; border-radius: 6px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Bridge Claim Tester</h2>
    
    <input type="text" id="loyaltyId" placeholder="Loyalty ID" />
    <input type="text" id="rewardId" placeholder="Reward ID" />
    <input type="number" id="quantity" value="1" min="1" placeholder="Jumlah" />
    
    <button id="checkBtn">Cek Bridge</button>
    <button id="startBtn">Mulai Claim</button>

    <div id="log"></div>
  </div>

  <script>
    const log = document.getElementById('log');

    function addLog(msg, type = 'info') {
      const time = new Date().toLocaleTimeString('id-ID');
      let color = type === 'success' ? '#00ff00' : type === 'error' ? '#ff4444' : '#ffff00';
      log.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span><br>`;
      log.scrollTop = log.scrollHeight;
    }

    // Setup agar lebih mirip asli
    function setupFakeEnvironment() {
      try {
        sessionStorage.setItem('mcd_in_app', '1');
        localStorage.setItem('mcd_in_app', '1');
      } catch(e) {}

      // Coba buat alias bridge
      if (window.GMA_Lite && window.GMA_Lite.bridge) {
        window.mcd = window.GMA_Lite;
        addLog("GMA_Lite bridge ditemukan", "success");
      }
    }

    function checkBridge() {
      setupFakeEnvironment();

      if (window.mcd && window.mcd.bridge) {
        addLog("✅ window.mcd.bridge TERDETEKSI!", "success");
        return true;
      }
      if (window.GMA_Lite && window.GMA_Lite.bridge) {
        addLog("✅ window.GMA_Lite.bridge TERDETEKSI!", "success");
        window.mcd = window.GMA_Lite;
        return true;
      }
      if (window.__GMALITE_BRIDGE__) {
        addLog("✅ __GMALITE_BRIDGE__ TERDETEKSI!", "success");
        return true;
      }

      addLog("❌ Bridge belum muncul. Coba refresh halaman di dalam aplikasi.", "error");
      return false;
    }

    async function claimWithBridge(loyaltyId, rewardId) {
      if (!window.mcd || !window.mcd.bridge) {
        addLog("Bridge tidak tersedia", "error");
        return { success: false };
      }

      return new Promise(resolve => {
        try {
          const message = window.mcd.bridge.message("offerActivation");
          let finished = false;
          const timeout = setTimeout(() => {
            if (!finished) {
              finished = true;
              addLog("⏰ Bridge Timeout", "error");
              resolve({ success: false });
            }
          }, 15000);

          message.on("data", () => {
            if (!finished) {
              finished = true;
              clearTimeout(timeout);
              addLog("✅ Bridge berhasil menerima claim", "success");
              resolve({ success: true });
            }
          });

          message.on("error", (err) => {
            if (!finished) {
              finished = true;
              clearTimeout(timeout);
              addLog(`❌ Bridge Error: ${err}`, "error");
              resolve({ success: false });
            }
          });

          message.send({
            loyaltyId: loyaltyId,
            rewardId: rewardId,
            autoActivate: false
          });
        } catch (e) {
          addLog(`Error: ${e.message}`, "error");
          resolve({ success: false });
        }
      });
    }

    // Event
    document.getElementById('checkBtn').onclick = checkBridge;

    document.getElementById('startBtn').onclick = async () => {
      const loyalty = document.getElementById('loyaltyId').value.trim();
      const reward = document.getElementById('rewardId').value.trim();
      const qty = parseInt(document.getElementById('quantity').value) || 1;

      if (!loyalty || !reward) {
        addLog("Loyalty ID dan Reward ID wajib diisi!", "error");
        return;
      }

      addLog("Memeriksa bridge...");
      if (!checkBridge()) return;

      for (let i = 1; i <= qty; i++) {
        addLog(`Claim #${i} → Loyalty: ${loyalty} | Reward: ${reward}`);
        await claimWithBridge(loyalty, reward);
        await new Promise(r => setTimeout(r, 800));
      }
    };

    // Auto check saat load
    window.onload = () => {
      setTimeout(checkBridge, 800);
      setTimeout(checkBridge, 2500);
    };
  </script>
</body>
</html>
