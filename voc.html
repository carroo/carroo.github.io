      const log = document.getElementById("log");

      function addLog(msg, type = "info") {
        const time = new Date().toLocaleTimeString("id-ID");
        let color =
          type === "success"
            ? "#22c55e"
            : type === "error"
              ? "#ef4444"
              : type === "warning"
                ? "#eab308"
                : "#93c5fd";
        log.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span><br>`;
        log.scrollTop = log.scrollHeight;
      }

      function clearLog() {
        log.innerHTML = "";
        addLog("Log dibersihkan", "info");
      }

      function setupFakeEnvironment() {
        try {
          sessionStorage.setItem("mcd_in_app", "1");
          localStorage.setItem("mcd_in_app", "1");
        } catch (e) {}
      }

      function checkBridge() {
        setupFakeEnvironment();
        if (
          window.mcd?.bridge ||
          window.GMA_Lite?.bridge ||
          window.__GMALITE_BRIDGE__
        ) {
          addLog("✅ Bridge TERDETEKSI!", "success");
          return true;
        }
        addLog(
          "❌ Bridge belum terdeteksi. Coba buka di dalam aplikasi.",
          "error",
        );
        return false;
      }

      async function claimWithBridge(loyaltyId, rewardId) {
        if (!window.mcd?.bridge && !window.GMA_Lite?.bridge) {
          addLog("Bridge tidak tersedia", "error");
          return { success: false };
        }

        return new Promise((resolve) => {
          try {
            const bridgeObj = window.mcd || window.GMA_Lite;
            const message = bridgeObj.bridge.message("offerActivation");
            let finished = false;
            const timeout = setTimeout(() => {
              if (!finished) {
                finished = true;
                addLog("⏰ Timeout - Bridge tidak merespons", "error");
                resolve({ success: false });
              }
            }, 15000);

            message.on("data", () => {
              if (!finished) {
                finished = true;
                clearTimeout(timeout);
                addLog("✅ Claim berhasil dikirim", "success");
                resolve({ success: true });
              }
            });

            message.on("error", (err) => {
              if (!finished) {
                finished = true;
                clearTimeout(timeout);
                addLog(`❌ Bridge Error: ${err}`, "error");
                resolve({ success: false });
              }
            });

            message.send({ loyaltyId, rewardId, autoActivate: false });
          } catch (e) {
            addLog(`Error: ${e.message}`, "error");
            resolve({ success: false });
          }
        });
      }

        return priceA - priceB;
      });

      function loadTemplates() {
        const select = document.getElementById("templateSelect");
        templates.forEach((tpl, index) => {
          const option = document.createElement("option");
          option.value = index;
          option.textContent = `${tpl.title} - ${tpl.subtitle}`;
          select.appendChild(option);
        });

        select.addEventListener("change", () => {
          const selected = templates[select.value];
          if (selected) {
            document.getElementById("loyaltyId").value = selected.loyaltyId;
            document.getElementById("rewardId").value = selected.rewardId;
            addLog(`✅ Template "${selected.title}" di-load`, "success");

        });

        const qty = parseInt(document.getElementById("quantity").value) || 1;
