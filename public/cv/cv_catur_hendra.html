<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>CV - Catur Hendra Putra Pamungkas</title>
    <style>
      :root {
        --text: #111111;
        --muted: #333333;
        --line: #111111;
        --font: Arial, Helvetica, sans-serif;

        --fs-base: 11.5px;
        --fs-small: 11px;
        --fs-h1: 20px;
        --fs-h2: 12.5px;
        --fs-org: 11.5px;

        --lh-base: 1.3;

        --spacing-body-x: 32px;
        --spacing-body-y: 28px;
        --spacing-section: 14px;
        --spacing-item: 8px;
        --spacing-list-left: 14px;
        --spacing-list-gap: 2px;
        --spacing-list-item: 2px;
        --spacing-list-item-skills: 3px;

        --print-fs-base: 10.5px;
        --print-spacing-body-x: 16px;
        --print-spacing-body-y: 12px;
        --print-page-margin: 8mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        max-width: 850px;
        margin: 0 auto;
        padding: var(--spacing-body-y) var(--spacing-body-x);
        line-height: var(--lh-base);
        font-size: var(--fs-base);
      }

      h1 {
        font-size: var(--fs-h1);
        margin: 0 0 2px 0;
        letter-spacing: 0.3px;
      }

      .contact-line {
        font-size: var(--fs-small);
        margin: 0 0 1px 0;
      }
      .contact-line a {
        color: var(--text);
        text-decoration: none;
      }
      .contact-line a:hover {
        text-decoration: underline;
      }

      .location {
        font-size: var(--fs-small);
        color: var(--muted);
        margin: 0 0 6px 0;
      }

      .summary {
        font-size: var(--fs-small);
        margin: 0 0 12px 0;
        text-align: justify;
      }

      h2 {
        font-size: var(--fs-h2);
        text-transform: none;
        border-bottom: 1.5px solid var(--line);
        padding-bottom: 3px;
        margin: var(--spacing-section) 0 6px 0;
      }

      .edu-item,
      .job {
        margin-bottom: var(--spacing-item);
      }

      .row-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
      }

      .org {
        font-weight: bold;
        font-size: var(--fs-org);
      }
      .org .place {
        font-weight: normal;
      }

      .dates {
        font-weight: normal;
        font-size: var(--fs-small);
        white-space: nowrap;
      }

      .role {
        font-style: italic;
        font-size: var(--fs-small);
        margin: 1px 0 2px 0;
      }

      .degree {
        font-style: italic;
        font-size: var(--fs-small);
        margin: 1px 0 0 0;
      }

      ul {
        margin: var(--spacing-list-gap) 0 0 0;
        padding-left: var(--spacing-list-left);
      }
      ul li {
        margin-bottom: var(--spacing-list-item);
        font-size: var(--fs-small);
        text-align: justify;
      }

      .skills-list {
        list-style: disc;
        padding-left: var(--spacing-list-left);
        margin: 0;
      }
      .skills-list li {
        margin-bottom: var(--spacing-list-item-skills);
        font-size: var(--fs-small);
      }
      .skills-list li strong {
        font-weight: bold;
      }

      @media print {
        body {
          padding: var(--print-spacing-body-y) var(--print-spacing-body-x);
          font-size: var(--print-fs-base);
          max-width: 100%;
        }
        @page {
          margin: var(--print-page-margin);
        }
      }
    </style>
  </head>

      function renderContacts(contacts) {
        return contacts
          .map((c) => (c.href ? `<a href="${c.href}">${c.label}</a>` : c.label))

      }

      function renderEducation(edu) {
        return edu

            (e) => `

      <div class="row-header">
        <div class="org">${e.school} - <span class="place">${e.place}</span></div>

      </div>
      <div class="degree">${e.degree}</div>
    </div>
  `,
          )
          .join("");
      }

      function renderExperience(exp) {
        return exp
          .map(
            (j) => `
    <div class="job">
      <div class="row-header">
        <div class="org">${j.company} - <span class="place">${
          j.place
        }</span></div>
        <div class="dates">${j.dates}</div>
      </div>
      <div class="role">${j.role}</div>
      <ul>
        ${j.bullets.map((b) => `<li>${b}</li>`).join("")}
      </ul>
    </div>
  `,
          )
          .join("");
      }

      function renderSkills(skills) {
        return `
    <ul class="skills-list">
      ${skills
        .map((s) => `<li><strong>${s.label}</strong>: ${s.value}</li>`)

    </ul>
  `;
      }

      function render() {
        const root = document.getElementById("cv-root");
        root.innerHTML = `
    <h1>${cvData.name}</h1>
    <p class="contact-line">${renderContacts(cvData.contacts)}</p>
    <p class="location">${cvData.location}</p>
    <p class="summary">${cvData.summary}</p>

    <h2>Education Level</h2>
    ${renderEducation(cvData.education)}

    <h2>Work Experiences</h2>
    ${renderExperience(cvData.experience)}

    <h2>Skills, Achievements &amp; Other Experience</h2>

      render();

  </body>
</html>
